name: Bot GLA

# Le bot tourne maintenant sur l'ordinateur à la maison (mobile.de bloque les serveurs).
# Ce workflow reste disponible en secours, à lancer à la main :
#   gh workflow run bot.yml --repo casicoco/gla-bot
# Ne pas le lancer pendant que le bot tourne à la maison (Telegram refuse deux bots en même temps).
on:
  workflow_dispatch:

permissions:
  contents: write # le bot enregistre les annonces dans docs/annonces.json

concurrency:
  group: bot-gla
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Bot allumé
        # Arrêt propre après 345 minutes ; le lancement suivant prend le relais.
        run: timeout --signal=INT 345m python bot.py || [ $? -eq 124 ]
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
